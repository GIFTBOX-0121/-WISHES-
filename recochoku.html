<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レコチョク GIFT</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gift-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .gift-title {
      font-weight: bold;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: default;
    }

    .gift-link {
      display: block;
      margin-top: 15px;
      padding: 13px;
      background: #333;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
    }

    .received {
      color: #999;
      text-align: center;
      padding: 10px 0;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎁 レコチョク GIFT</h1>

    <div id="gift-list">
      読み込み中...
    </div>

    <a href="index.html" class="back">← サービス選択に戻る</a>
  </div>

  <script>
    const SUPABASE_URL = "https://cgnluuynrurbsipwwluo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pZbtlCfKh1BVOxHaeXBIAA_CvfP0o0q";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const giftList = document.getElementById("gift-list");

    async function loadGifts() {
      giftList.innerHTML = "読み込み中...";

      const { data: gifts, error: giftsError } = await supabase
        .from("gifts")
        .select("id, gift_code")
        .eq("service", "recochoku")
        .order("id", { ascending: true });

      if (giftsError) {
        giftList.innerHTML = "ギフトの読み込みに失敗しました。";
        console.error(giftsError);
        return;
      }

      const { data: receipts, error: receiptsError } = await supabase
        .from("gift_receipts")
        .select("gift_id");

      if (receiptsError) {
        giftList.innerHTML = "受け取り状況の読み込みに失敗しました。";
        console.error(receiptsError);
        return;
      }

      const receivedIds = new Set(
        receipts.map(receipt => receipt.gift_id)
      );

      giftList.innerHTML = "";

      if (!gifts || gifts.length === 0) {
        giftList.innerHTML = "<p>現在、受け取れるギフトはありません。</p>";
        return;
      }

      gifts.forEach((gift, index) => {
        const card = document.createElement("div");
        card.className = "gift-card";

        const title = document.createElement("div");
        title.className = "gift-title";
        title.textContent = `Gift ${String(index + 1).padStart(3, "0")}`;

        card.appendChild(title);

        if (receivedIds.has(gift.id)) {
          const received = document.createElement("div");
          received.className = "received";
          received.textContent = "受け取り済み";
          card.appendChild(received);
        } else {
          const button = document.createElement("button");
          button.textContent = "ギフトを受け取る";

          button.addEventListener("click", async () => {
            button.disabled = true;
            button.textContent = "受け取り中...";

            const { error } = await supabase
              .from("gift_receipts")
              .insert({
                gift_id: gift.id,
                received_at: new Date().toISOString()
              });

            if (error) {
              console.error(error);
              alert("受け取りに失敗しました。");
              button.disabled = false;
              button.textContent = "ギフトを受け取る";
              return;
            }

            card.innerHTML = "";

            const newTitle = document.createElement("div");
            newTitle.className = "gift-title";
            newTitle.textContent = `Gift ${String(index + 1).padStart(3, "0")}`;

            const link = document.createElement("a");
            link.className = "gift-link";
            link.href = gift.gift_code;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "🎁 ギフトを開く";

            card.appendChild(newTitle);
            card.appendChild(link);
          });

          card.appendChild(button);
        }

        giftList.appendChild(card);
      });
    }

    loadGifts();
  </script>

</body>
</html>
