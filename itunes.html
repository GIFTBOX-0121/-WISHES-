<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iTunes Gift</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gift-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .receive-button,
    .copy-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .receive-button {
      background: #333;
      color: white;
    }

    .copy-button {
      margin-top: 10px;
      background: #eee;
      color: #333;
    }

    .code {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
      cursor: pointer;
    }

    .received {
      text-align: center;
      color: #999;
      padding: 10px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>iTunes Gift</h1>

    <div id="gift-list"></div>

    <a href="index.html" class="back">
      ← サービス選択に戻る
    </a>

  </div>

  <script>

    const SUPABASE_URL =
      "https://cgnluuynrurbsipwwluo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pZbtlCfKh1BVOxHaeXBIAA_CvfP0o0q";

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const giftList =
      document.getElementById("gift-list");


    async function loadGifts() {

      giftList.innerHTML = "";


      const { data: gifts, error: giftsError } =
        await supabase
          .from("gifts")
          .select("id, gift_code")
          .eq("service", "itunes")
          .order("id", { ascending: true });


      if (giftsError) {

        console.error(giftsError);

        giftList.innerHTML =
          "<p>Giftを読み込めませんでした。</p>";

        return;
      }


      const { data: receipts, error: receiptsError } =
        await supabase
          .from("gift_receipts")
          .select("gift_id");


      if (receiptsError) {

        console.error(receiptsError);

        giftList.innerHTML =
          "<p>Giftを読み込めませんでした。</p>";

        return;
      }


      const receivedIds =
        new Set(
          receipts.map(item => item.gift_id)
        );


      gifts.forEach((gift, index) => {

        const card =
          document.createElement("div");

        card.className = "gift-card";


        if (receivedIds.has(gift.id)) {

          card.innerHTML = `
            <div class="received">
              受け取り済み
            </div>
          `;

        } else {

          card.innerHTML = `
            <button class="receive-button">
              コードを受け取る
            </button>
          `;


          const button =
            card.querySelector(".receive-button");


          button.addEventListener(
            "click",
            async () => {

              button.disabled = true;
              button.textContent = "受け取り中...";


              const { error } =
                await supabase
                  .from("gift_receipts")
                  .insert({
                    gift_id: gift.id,
                    received_at:
                      new Date().toISOString()
                  });


              if (error) {

                console.error(error);

                button.disabled = false;
                button.textContent =
                  "コードを受け取る";

                alert(
                  "受け取りに失敗しました。"
                );

                return;
              }


              card.innerHTML = `

                <div
                  class="code"
                  id="code-${gift.id}"
                  title="タップしてコピー"
                >
                  ${gift.gift_code}
                </div>

                <button
                  class="copy-button"
                  id="copy-${gift.id}"
                >
                  📋 コードをコピー
                </button>

              `;


              const code =
                document.getElementById(
                  `code-${gift.id}`
                );

              const copyButton =
                document.getElementById(
                  `copy-${gift.id}`
                );


              async function copyCode() {

                try {

                  await navigator.clipboard.writeText(
                    gift.gift_code
                  );

                  copyButton.textContent =
                    "✓ コピーしました";

                  setTimeout(() => {

                    copyButton.textContent =
                      "📋 コードをコピー";

                  }, 1500);

                } catch (error) {

                  console.error(error);

                  alert(
                    "コピーできませんでした。"
                  );

                }

              }


              copyButton.addEventListener(
                "click",
                copyCode
              );


              code.addEventListener(
                "click",
                copyCode
              );

            }
          );

        }


        giftList.appendChild(card);

      });

    }


    loadGifts();

  </script>

</body>
</html>
