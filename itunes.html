<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>iTunes</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f7f7f7;
      margin: 0;
      padding: 30px 15px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .header-image {
      display: block;
      width: 100%;
      max-width: 500px;
      height: auto;
      margin: 0 auto 15px;
      border-radius: 12px;
    }

    .stats {
      margin-top: 10px;
    }

    .line {
      border-top: 1px solid #ddd;
      margin: 14px 0;
    }

    .counter {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #d94b4b;
    }

    .time {
      font-size: 12px;
      color: #999;
      margin-bottom: 3px;
    }

    .total {
      font-size: 13px;
      color: #777;
    }

    .gift-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .receive-button,
    .copy-button,
    .complete-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .receive-button {
      background: #333;
      color: white;
    }

    .receive-button:disabled,
    .complete-button:disabled {
      background: #aaa;
    }

    .code {
      background: #f1f1f1;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      word-break: break-all;
      cursor: pointer;
      -webkit-user-select: text;
      user-select: text;
    }

    .copy-button {
      margin-top: 10px;
      background: #eee;
      color: #333;
    }

    .complete-button {
      margin-top: 10px;
      background: #333;
      color: white;
    }

    .received {
      text-align: center;
      color: #999;
      padding: 10px;
    }

    .already-taken {
      text-align: center;
      color: #999;
      padding: 10px;
    }

    .error {
      text-align: center;
      color: #d00;
      background: white;
      padding: 15px;
      border-radius: 10px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>

      <h1>iTunes</h1>

      <img
        class="header-image"
        src="24BAC62E-3563-42A4-9EE5-F72598664198.jpeg"
        alt=""
      >

      <div class="stats">

        <div class="line"></div>

        <div class="counter" id="counter">
          未受け取り🎁0件
        </div>

        <div class="time" id="update-time">
          9月22日 00:00時点
        </div>

        <div class="total" id="total">
          Total：0件
        </div>

        <div class="line"></div>

      </div>

    </header>

    <div id="gift-list"></div>

    <a href="index.html" class="back">
      ← サービス選択に戻る
    </a>

  </div>


  <script>

    const SUPABASE_URL =
      "https://cgnluuynrurbsipwwluo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pZbtlCfKh1BVOxHaeXBIAA_CvfP0o0q";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const giftList =
      document.getElementById("gift-list");

    const counter =
      document.getElementById("counter");

    const updateTime =
      document.getElementById("update-time");

    const total =
      document.getElementById("total");


    function updateTimeDisplay() {

      const now = new Date();

      const month =
        now.getMonth() + 1;

      const day =
        now.getDate();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      updateTime.textContent =
        `${month}月${day}日 ${hours}:${minutes}時点`;

    }


    async function copyText(text) {

      try {

        if (
          navigator.clipboard &&
          window.isSecureContext
        ) {

          await navigator.clipboard.writeText(text);

          return true;

        }

      } catch (error) {

        console.log(error);

      }


      try {

        const textarea =
          document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(
          0,
          textarea.value.length
        );

        const success =
          document.execCommand("copy");

        document.body.removeChild(textarea);

        return success;

      } catch (error) {

        console.error(error);

        return false;

      }

    }


    async function loadGifts() {

      try {

        const { data: gifts, error } =
          await client
            .from("gifts")
            .select(
              "id, gift_code, service"
            )
            .eq("service", "itunes")
            .order("id", {
              ascending: true
            });


        if (error) {

          console.error(error);

          giftList.innerHTML = `
            <div class="error">
              Giftを読み込めませんでした。
            </div>
          `;

          return;
        }


        const { data: receipts, error: receiptError } =
          await client
            .from("gift_receipts")
            .select("gift_id");


        if (receiptError) {

          console.error(receiptError);

          giftList.innerHTML = `
            <div class="error">
              受け取り情報を読み込めませんでした。
            </div>
          `;

          return;
        }


        const receivedIds =
          new Set(
            (receipts || []).map(
              item => item.gift_id
            )
          );


        const totalCount =
          gifts.length;


        const receivedCount =
          gifts.filter(
            gift =>
              receivedIds.has(gift.id)
          ).length;


        const unreceivedCount =
          totalCount - receivedCount;


        counter.textContent =
          `未受け取り🎁${unreceivedCount}件`;


        total.textContent =
          `Total：${totalCount}件`;


        updateTimeDisplay();


        const sortedGifts =
          [...gifts].sort(
            (a, b) => {

              const aReceived =
                receivedIds.has(a.id);

              const bReceived =
                receivedIds.has(b.id);


              if (
                aReceived === bReceived
              ) {

                return a.id - b.id;

              }


              return aReceived
                ? 1
                : -1;

            }
          );


        giftList.innerHTML = "";


        sortedGifts.forEach(
          gift => {

            const card =
              document.createElement(
                "div"
              );

            card.className =
              "gift-card";


            if (
              receivedIds.has(
                gift.id
              )
            ) {

              card.innerHTML = `
                <div class="received">
                  受け取り済み
                </div>
              `;

            } else {

              card.innerHTML = `
                <button class="receive-button">
                  コードを受け取る
                </button>
              `;


              const button =
                card.querySelector(
                  ".receive-button"
                );


              button.addEventListener(
                "click",
                async function () {

                  button.disabled =
                    true;

                  button.textContent =
                    "受け取り中...";


                  const { error } =
                    await client
                      .from("gift_receipts")
                      .insert({
                        gift_id:
                          gift.id,

                        received_at:
                          new Date()
                            .toISOString()
                      });


                  if (error) {

                    console.error(
                      error
                    );


                    if (
                      error.code ===
                      "23505"
                    ) {

                      card.innerHTML = `
                        <div class="already-taken">
                          このGiftは<br>
                          受け取り済みです。
                        </div>
                      `;

                      await loadGifts();

                      return;

                    }


                    button.disabled =
                      false;

                    button.textContent =
                      "コードを受け取る";

                    alert(
                      "受け取りに失敗しました。"
                    );

                    return;

                  }


                  card.innerHTML = `

                    <div
                      class="code"
                      title="タップしてコピー"
                    >
                      ${gift.gift_code}
                    </div>

                    <button
                      class="copy-button"
                    >
                      📋 コードをコピー
                    </button>

                    <button
                      class="complete-button"
                    >
                      ✓ 受け取り完了
                    </button>

                  `;


                  const code =
                    card.querySelector(
                      ".code"
                    );

                  const copyButton =
                    card.querySelector(
                      ".copy-button"
                    );

                  const completeButton =
                    card.querySelector(
                      ".complete-button"
                    );


                  async function doCopy() {

                    const success =
                      await copyText(
                        gift.gift_code
                      );


                    if (success) {

                      copyButton.textContent =
                        "✓ コピーしました";


                      setTimeout(
                        function () {

                          copyButton.textContent =
                            "📋 コードをコピー";

                        },
                        1500
                      );

                    } else {

                      alert(
                        "コピーできませんでした。\nコードを長押ししてコピーしてください。"
                      );

                    }

                  }


                  code.addEventListener(
                    "click",
                    doCopy
                  );


                  copyButton.addEventListener(
                    "click",
                    doCopy
                  );


                  completeButton.addEventListener(
                    "click",
                    async function () {

                      completeButton.disabled =
                        true;

                      completeButton.textContent =
                        "処理中...";


                      card.innerHTML = `
                        <div class="received">
                          受け取り済み
                        </div>
                      `;


                      await loadGifts();

                    }
                  );

                }
              );

            }


            giftList.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(error);

        giftList.innerHTML = `
          <div class="error">
            エラーが発生しました。
          </div>
        `;

      }

    }


    loadGifts();


    updateTimeDisplay();


    setInterval(
      updateTimeDisplay,
      60000
    );


    setInterval(
      loadGifts,
      30000
    );

  </script>

</body>
</html>
