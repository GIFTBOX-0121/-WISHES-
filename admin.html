<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIFTBOX 管理</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: #f7f7f7;
  margin: 0;
  padding: 30px 15px;
  color: #333;
}

.container {
  max-width: 600px;
  margin: 0 auto;
}

h1 {
  text-align: center;
  font-size: 27px;
  margin: 10px 0 8px;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 25px;
}


/* 累計 */

.summary {
  background: #333;
  color: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 22px;
  text-align: center;
}

.summary-title {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 5px;
}

.summary-number {
  font-size: 30px;
  font-weight: bold;
}


/* 日別カード */

.day-card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.07);
}

.date {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 16px;
  text-align: center;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 9px 4px;

  border-bottom:
    1px solid #eee;
}

.service-name {
  font-size: 15px;
}

.count {
  font-size: 16px;
  font-weight: bold;
}

.total-row {
  display: flex;
  justify-content: space-between;

  margin-top: 12px;
  padding-top: 13px;

  border-top:
    2px solid #ddd;

  font-weight: bold;
}


/* 空 */

.empty {
  background: white;
  border-radius: 14px;
  padding: 30px 20px;
  text-align: center;
  color: #999;
}


/* エラー */

.error {
  background: white;
  border-radius: 14px;
  padding: 25px 20px;
  text-align: center;
  color: #d94b4b;
}


/* 更新時間 */

.update {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin: 20px 0;
}

</style>
</head>


<body>


<div class="container">


<h1>
⭐️ GIFTBOX 管理 ⭐️
</h1>


<div class="subtitle">
Gift追加数
</div>



<div class="summary">

  <div class="summary-title">
    累計Gift
  </div>

  <div
    id="grand-total"
    class="summary-number"
  >
    0
  </div>

</div>



<div id="stats"></div>



<div
  id="update-time"
  class="update"
></div>


</div>



<script>


const SUPABASE_URL =
  "https://cgnluuynrurbsipwwluo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_pZbtlCfKh1BVOxHaeXBIAA_CvfP0o0q";


const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const stats =
  document.getElementById(
    "stats"
  );


const grandTotal =
  document.getElementById(
    "grand-total"
  );


const updateTime =
  document.getElementById(
    "update-time"
  );



/* =========================
   日付表示
========================= */


function formatDate(dateString) {


  const parts =
    dateString.split("-");


  const year =
    Number(parts[0]);


  const month =
    Number(parts[1]);


  const day =
    Number(parts[2]);


  return (
    year +
    "年" +
    month +
    "月" +
    day +
    "日"
  );

}



/* =========================
   更新時刻
========================= */


function showUpdateTime() {


  const now =
    new Date();


  const text =
    new Intl.DateTimeFormat(
      "ja-JP",
      {

        timeZone:
          "Asia/Tokyo",

        month:
          "numeric",

        day:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit",

        hour12:
          false

      }
    ).format(now);


  updateTime.textContent =
    text +
    " 時点";

}



/* =========================
   永久保存データ読み込み
========================= */


async function loadStats() {


  const {
    data,
    error
  } =
    await client

      .from(
        "gift_daily_stats"
      )

      .select(
        "stat_date, service, gift_count"
      )

      .order(
        "stat_date",
        {
          ascending: false
        }
      );


  if (error) {


    console.error(
      error
    );


    stats.innerHTML =
      `<div class="error">
        集計データを読み込めませんでした。
      </div>`;


    return;

  }



  const records =
    data || [];



  /*
    全期間累計
  */


  let allTotal =
    0;


  records.forEach(
    item => {


      allTotal +=
        Number(
          item.gift_count
        ) || 0;


    }
  );


  grandTotal.textContent =
    allTotal;



  /*
    データなし
  */


  if (
    records.length === 0
  ) {


    stats.innerHTML =
      `<div class="empty">
        まだ記録はありません🎁
      </div>`;


    showUpdateTime();


    return;

  }



  /*
    日付ごとにまとめる
  */


  const grouped =
    {};


  records.forEach(
    item => {


      const date =
        item.stat_date;


      if (
        !grouped[date]
      ) {


        grouped[date] =
          {

            itunes: 0,

            recochoku: 0,

            mumo: 0,

            total: 0

          };

      }



      const count =
        Number(
          item.gift_count
        ) || 0;



      if (
        item.service ===
        "itunes"
      ) {


        grouped[date]
          .itunes +=
          count;

      }



      if (
        item.service ===
        "recochoku"
      ) {


        grouped[date]
          .recochoku +=
          count;

      }



      if (
        item.service ===
        "mumo"
      ) {


        grouped[date]
          .mumo +=
          count;

      }



      grouped[date]
        .total +=
        count;


    }
  );



  /*
    新しい日付順
  */


  const dates =
    Object.keys(
      grouped
    ).sort(
      (a, b) =>
        b.localeCompare(a)
    );



  stats.innerHTML =
    "";



  /*
    カード作成
  */


  dates.forEach(
    date => {


      const counts =
        grouped[date];


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "day-card";


      card.innerHTML =
        `

        <div class="date">

          ${formatDate(date)}

        </div>


        <div class="row">

          <span class="service-name">
            iTunes
          </span>

          <span class="count">
            ${counts.itunes}件
          </span>

        </div>


        <div class="row">

          <span class="service-name">
            レコチョク
          </span>

          <span class="count">
            ${counts.recochoku}件
          </span>

        </div>


        <div class="row">

          <span class="service-name">
            mu-mo
          </span>

          <span class="count">
            ${counts.mumo}件
          </span>

        </div>


        <div class="total-row">

          <span>
            合計
          </span>

          <span>
            ${counts.total}件
          </span>

        </div>

        `;


      stats.appendChild(
        card
      );


    }
  );


  showUpdateTime();

}



/* =========================
   初回読み込み
========================= */


loadStats();



/* =========================
   30秒ごとに自動更新
========================= */


setInterval(
  loadStats,
  30000
);


</script>


</body>
</html>
